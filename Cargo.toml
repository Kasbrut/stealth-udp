[package]
name = "stealth-udp"
version = "1.0.0"
authors = ["Kasbrut <lorenzo.caputo1998@gmail.com>"]
edition = "2021"

[dependencies]
pnet = "0.35.0"
pcap = "2"
clap = "4.5.27"
chrono = "0.4"
ctrlc = "3.4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
tempfile = "3"
